app-id: com.shadhin.browser
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: shadhin-browser

finish-args:
  # Display & Graphics
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Audio
  - --socket=pulseaudio

  # Network access (standard for web browsers)
  - --share=network

  # File system: Downloads directory read/write for user downloads
  - --filesystem=xdg-download:rw

  # Settings and configuration
  - --filesystem=xdg-run/dconf
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

  # Portals for file selection, printing, URI opening, and dark mode detection
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Print
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.FdoStyle

  # WebKitGTK sub-sandboxing support inside Flatpak:
  # Allows WebKit to spawn isolated WebKitWebProcess child instances via the portal
  - --talk-name=org.freedesktop.portal.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/shadhin-browser/cargo

modules:
  - name: shadhin-browser
    buildsystem: simple
    build-commands:
      # Build release binary using vendored cargo sources
      - cargo --offline build --release --locked
      # Install binary
      - install -Dm755 target/release/shadhin-browser /app/bin/shadhin-browser
      # Install desktop entry and AppStream metainfo
      - install -Dm644 data/com.shadhin.browser.desktop /app/share/applications/com.shadhin.browser.desktop
      - install -Dm644 data/com.shadhin.browser.metainfo.xml /app/share/metainfo/com.shadhin.browser.metainfo.xml
      # Install SVG icons
      - install -Dm644 data/icons/hicolor/scalable/apps/com.shadhin.browser.svg /app/share/icons/hicolor/scalable/apps/com.shadhin.browser.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/com.shadhin.browser-symbolic.svg /app/share/icons/hicolor/symbolic/apps/com.shadhin.browser-symbolic.svg
      # Install raster PNG icons
      - install -Dm644 data/icons/hicolor/48x48/apps/com.shadhin.browser.png /app/share/icons/hicolor/48x48/apps/com.shadhin.browser.png
      - install -Dm644 data/icons/hicolor/64x64/apps/com.shadhin.browser.png /app/share/icons/hicolor/64x64/apps/com.shadhin.browser.png
      - install -Dm644 data/icons/hicolor/128x128/apps/com.shadhin.browser.png /app/share/icons/hicolor/128x128/apps/com.shadhin.browser.png
      - install -Dm644 data/icons/hicolor/256x256/apps/com.shadhin.browser.png /app/share/icons/hicolor/256x256/apps/com.shadhin.browser.png
      - install -Dm644 data/icons/hicolor/512x512/apps/com.shadhin.browser.png /app/share/icons/hicolor/512x512/apps/com.shadhin.browser.png
    sources:
      - type: dir
        path: ../../
      - cargo-sources.json
