    <path d="M 22 96 C 42 96, 68 84, 86 64 C 70 68, 52 70, 36 68 C 48 60, 64 48, 78 36 C 62 40, 48 42, 34 38 C 50 30, 74 18, 98 22 C 108 24, 114 30, 112 40 C 108 58, 88 88, 62 104 C 44 114, 28 108, 22 96 Z"
